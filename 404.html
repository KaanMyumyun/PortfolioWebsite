<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Page Not Found | Kaan Myumyun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/favicon.jpg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0eeeb;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .wrapper { max-width: 420px; }
    .code {
      font-size: 6rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #e0ddd8;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
    }
    p {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 2rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.6rem 1.4rem;
      border-radius: 7px;
      text-decoration: none;
      transition: background 0.15s;
    }
    a:hover { background: #333; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>Looks like this page doesn't exist or was moved. Head back to the portfolio.</p>
    <a href="/PortfolioWebsite/">← Back to Portfolio</a>
  </div>
</body>
</html>
